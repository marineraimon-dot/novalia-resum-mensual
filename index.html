  /* ── Header ── */

    margin-bottom: 20px;
  }
  .month-tab {
    padding: 6px 14px;

  .month-tab.is-any {

    border-color: #4a7c59;
    color: #2d6a4f;
    font-weight: 700;
  }

  /* ── Full-width chart (evolució mensual) ── */
  .chart-card.is-wide { margin-bottom: 16px; }
  .chart-card.is-wide .chart-wrap { height: 260px; }

  /* ── KPI row ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid #e8e8e0;
  }
  .kpi-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #888;
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 1.7rem;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1;
  }
  .kpi-unit {
    font-size: 0.8rem;
    color: #888;
    margin-top: 4px;
  }

  /* ── Charts section ── */
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    border: 1px solid #e8e8e0;
  }
  .chart-card h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #888;
    margin-bottom: 16px;
  }
  .chart-wrap {
    position: relative;
    height: 220px;
  }

    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

  }

    border-radius: 10px;
    padding: 20px;
    border: 1px solid #e8e8e0;

    margin-bottom: 14px;

    font-weight: 600;
    color: #555;

  tr:last-child td {

// ── Acumulat anual ───────────────────────────────────────────────────────────
// Es calcula aquí, a partir de DATA, i NO dins del bloc //__DATA_START__:
// així actualitza_dashboard.ps1 no l'esborra i cada mes nou hi entra tot sol.
const ANY_RE = /^Any /;
const round2 = n => Math.round(n * 100) / 100;

function mesosPerAny() {
  const grups = new Map();                       // "2026" -> ["Gener 2026", ...]
  for (const k of Object.keys(DATA)) {
    if (ANY_RE.test(k)) continue;
    const m = k.match(/(\d{4})\s*$/);
    if (!m) continue;
    if (!grups.has(m[1])) grups.set(m[1], []);
    grups.get(m[1]).push(k);                     // ordre cronològic = ordre de DATA
  }
  return grups;
}

function acumula(mesos, camp) {
  // Agrupem ignorant majúscules/minúscules, igual que fa el PowerShell dins de
  // cada mes (les taules hash de PowerShell no distingeixen caixa). Si no, un
  // «Puiggené» al maig i un «PUIGGENÉ» al juny sortirien com dos transportistes.
  // Es conserva la primera grafia que apareix, en ordre cronològic.
  const per = new Map();
  for (const mk of mesos) {
    for (const r of (DATA[mk][camp] || [])) {
      const clau = r.nom.toLocaleLowerCase('ca');
      const e = per.get(clau) || { nom: r.nom, tones: 0, viatges: 0, mesos: 0 };
      e.tones += r.tones;
      e.viatges += (r.viatges || 0);
      e.mesos += 1;
      per.set(clau, e);
    }
  }
  return [...per.values()]
    .map(e => ({ ...e, tones: round2(e.tones) }))
    .sort((a, b) => b.tones - a.tones);
}

function construeixAcumulats() {
  const claus = [];
  for (const [any, mesos] of mesosPerAny()) {
    if (mesos.length < 2) continue;              // amb un sol mes no aporta res
    const proveidors = acumula(mesos, 'proveidors');
    const clients = acumula(mesos, 'clients');
    const tones = round2(mesos.reduce((a, k) => a + DATA[k].kpis.tones, 0));
    const viatges = mesos.reduce((a, k) => a + DATA[k].kpis.viatges, 0);
    const clau = 'Any ' + any;
    DATA[clau] = {
      esAnual: true,
      kpis: {
        tones,
        viatges,
        mitja: viatges ? round2(tones / viatges) : 0,
        proveidors: proveidors.length,
        clients: clients.length
      },
      proveidors,
      clients,
      transportistes: acumula(mesos, 'transportistes'),
      estelladores: acumula(mesos, 'estelladores'),
      mesos: mesos.map(k => ({
        nom: k.replace(/\s*\d{4}\s*$/, ''),
        tones: DATA[k].kpis.tones,
        viatges: DATA[k].kpis.viatges
      }))
    };
    claus.push(clau);
  }
  return claus;
}

const CLAUS_ANUALS = construeixAcumulats();

// ── Chart instances ──────────────────────────────────────────────────────────
let charts = {};

const GREENS = [
  '#2d6a4f','#40916c','#52b788','#74c69d','#95d5b2','#b7e4c7','#d8f3dc','#1b4332'
];
const ORANGES = [
  '#e76f51','#f4a261','#e9c46a','#264653','#2a9d8f','#a8dadc','#457b9d','#d62828','#c77dff'
];

function fmt(n, dec=2) {
  if (n === undefined || n === null) return '—';
  return n.toLocaleString('ca-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function pct(part, total) {
  return ((part / total) * 100).toFixed(1) + '%';
}

// Amb més categories que colors la paleta es repetiria i el donut es faria
// il·legible: agrupem la cua a «Altres». Les taules segueixen mostrant-ho tot.
function perAlDonut(files, maxColors) {
  if (files.length <= maxColors) return files;
  const cap = files.slice(0, maxColors - 1);
  const cua = files.slice(maxColors - 1);
  return cap.concat([{
    nom: `Altres (${cua.length})`,
    tones: Math.round(cua.reduce((a, r) => a + r.tones, 0) * 100) / 100
  }]);
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function renderMonth(monthKey) {
  destroyCharts();
  const d = DATA[monthKey];
  if (!d) return;

  const totalProv = d.proveidors.reduce((a,x) => a + x.tones, 0);
  const totalCli  = d.clients.reduce((a,x) => a + x.tones, 0);
  const totalTr   = d.transportistes.reduce((a,x) => a + x.tones, 0);
  const totalEst  = d.estelladores.reduce((a,x) => a + x.tones, 0);

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Tones netes</div>
        <div class="kpi-value">${fmt(d.kpis.tones, 0)}</div>
        <div class="kpi-unit">t</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Viatges</div>
        <div class="kpi-value">${d.kpis.viatges}</div>
        <div class="kpi-unit">#</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Mitjana/viatge</div>
        <div class="kpi-value">${fmt(d.kpis.mitja, 1)}</div>
        <div class="kpi-unit">t/viatge</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Proveïdors actius</div>
        <div class="kpi-value">${d.kpis.proveidors}</div>
        <div class="kpi-unit">#</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Clients actius</div>
        <div class="kpi-value">${d.kpis.clients}</div>
        <div class="kpi-unit">#</div>
      </div>
    </div>

    ${d.mesos ? `
    <div class="chart-card is-wide">
      <h3>Evolució mensual · tones netes</h3>
      <div class="chart-wrap"><canvas id="chartMesos"></canvas></div>
    </div>` : ''}

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Tones per proveïdor</h3>
        <div class="chart-wrap"><canvas id="chartProv"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Tones per client</h3>
        <div class="chart-wrap"><canvas id="chartCli"></canvas></div>
      </div>
    </div>

    <div class="tables-grid">
      <div class="table-card">
        <h3>Detall proveïdors</h3>
        <table>
          <thead><tr><th>Proveïdor</th><th>Tones</th><th>Viatges</th><th>%</th></tr></thead>
          <tbody>
            ${d.proveidors.map(r => `<tr>
              <td>${r.nom}</td>
              <td>${fmt(r.tones)}</td>
              <td>${r.viatges}</td>
              <td class="pct">${pct(r.tones, totalProv)}</td>
            </tr>`).join('')}
            <tr><td>TOTAL</td><td>${fmt(totalProv)}</td><td>${d.proveidors.reduce((a,x)=>a+x.viatges,0)}</td><td></td></tr>
          </tbody>
        </table>
      </div>

      <div class="table-card">
        <h3>Detall clients</h3>
        <table>
          <thead><tr><th>Client</th><th>Tones</th><th>Viatges</th><th>%</th></tr></thead>
          <tbody>
            ${d.clients.map(r => `<tr>
              <td>${r.nom}</td>
              <td>${fmt(r.tones)}</td>
              <td>${r.viatges}</td>
              <td class="pct">${pct(r.tones, totalCli)}</td>
            </tr>`).join('')}
            <tr><td>TOTAL</td><td>${fmt(totalCli)}</td><td>${d.clients.reduce((a,x)=>a+x.viatges,0)}</td><td></td></tr>
          </tbody>
        </table>
      </div>

      <div class="table-card">
        <h3>Transportistes</h3>
        <table>
          <thead><tr><th>Transportista</th><th>Tones</th><th>%</th></tr></thead>
          <tbody>
            ${d.transportistes.map(r => `<tr>
              <td>${r.nom}</td>
              <td>${fmt(r.tones)}</td>
              <td class="pct">${pct(r.tones, totalTr)}</td>
            </tr>`).join('')}
            <tr><td>TOTAL</td><td>${fmt(totalTr)}</td><td></td></tr>
          </tbody>
        </table>
      </div>

      <div class="table-card">
        <h3>Estelladores</h3>
        <table>
          <thead><tr><th>Estelladora</th><th>Tones</th><th>%</th></tr></thead>
          <tbody>
            ${d.estelladores.map(r => `<tr>
              <td>${r.nom}</td>
              <td>${fmt(r.tones)}</td>
              <td class="pct">${pct(r.tones, totalEst)}</td>
            </tr>`).join('')}
            <tr><td>TOTAL</td><td>${fmt(totalEst)}</td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Barres: evolució mensual (només a la pestanya d'acumulat anual)
  if (d.mesos) {
    charts.mesos = new Chart(document.getElementById('chartMesos'), {
      type: 'bar',
      data: {
        labels: d.mesos.map(r => r.nom),
        datasets: [{ data: d.mesos.map(r => r.tones), backgroundColor: '#4a7c59',
                     borderRadius: 4, maxBarThickness: 64 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx =>
            ` ${fmt(ctx.raw)} t · ${d.mesos[ctx.dataIndex].viatges} viatges` } }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: '#ecece4' },
               ticks: { callback: v => fmt(v, 0) } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // Donut: proveïdors
  const donutProv = perAlDonut(d.proveidors, GREENS.length);
  charts.prov = new Chart(document.getElementById('chartProv'), {
    type: 'doughnut',
    data: {
      labels: donutProv.map(r => r.nom),
      datasets: [{ data: donutProv.map(r => r.tones), backgroundColor: GREENS, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)} t (${pct(ctx.raw, totalProv)})` } }
      }
    }
  });

  // Donut: clients
  const donutCli = perAlDonut(d.clients, ORANGES.length);
  charts.cli = new Chart(document.getElementById('chartCli'), {
    type: 'doughnut',
    data: {
      labels: donutCli.map(r => r.nom),
      datasets: [{ data: donutCli.map(r => r.tones), backgroundColor: ORANGES, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)} t (${pct(ctx.raw, totalCli)})` } }
      }
    }
  });
}

// ── Month tabs ───────────────────────────────────────────────────────────────
function buildTabs(inicial) {
  const months = Object.keys(DATA);
  const container = document.getElementById('monthTabs');
  container.innerHTML = '';
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (ANY_RE.test(m) ? ' is-any' : '')
                                + (m === inicial ? ' active' : '');
    btn.textContent = m;
    btn.onclick = () => {
      document.querySelectorAll('.month-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMonth(m);
    };
    container.appendChild(btn);
  });
}

// S'obre l'últim MES carregat, no l'acumulat: l'anual queda a l'última pestanya.
const ULTIM_MES = Object.keys(DATA).filter(k => !ANY_RE.test(k)).at(-1);
buildTabs(ULTIM_MES);
renderMonth(ULTIM_MES);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
